name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.10", "3.11", "3.12", "3.13"]
        include:
          - os: macos-latest
            python: "3.13"
          - os: windows-latest
            python: "3.13"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --locked
      - run: uv run pytest

  eval:
    # Guards against silent regressions: rebuilds the dataset and checks the
    # bundled model reproduces from the train split, then reports test metrics.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - name: Dataset is reproducible from sources
        run: |
          uv run python scripts/build_dataset.py
          git diff --exit-code data/dataset.jsonl
      - name: Bundled model is reproducible from the train split
        run: uv run python scripts/train.py --check
      - name: Held-out evaluation
        run: uv run python scripts/eval.py | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Example scan
        run: uv run promptfence scan examples/product_page.html --color always --fail-on never
